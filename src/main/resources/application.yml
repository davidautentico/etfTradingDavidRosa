simulator:
  symbol: smaMeanReverting
  data-directory: data
  initial-capital: 10000
  strategy: fleury
  show-trades: true
  show-loss-week: true
  loss-week-threshold: -5.0
  show-max-dd: true
  commission-rate: 0.0005

optimizer:
  symbol: QQQ3
  data-directory: data
  initial-capital: 10000
  commission-rate: 0.0005
  show-progress: true

  tp:
    min: 0.01
    max: 0.10
    step: 0.005

  tph:
    min: 0.02
    max: 0.15
    step: 0.005

  sl:
    min: 0.001
    max: 0.02
    step: 0.001

  output-file: data/optimization/fleury_optimization.csv
  sort-by: sharpe

