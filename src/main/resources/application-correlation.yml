correlation:
  initial-capital: 100000
  output-directory: data/correlation

  # Optional inclusive study period. Leave empty to use all available data.
  start-date: 2020-01-01
  end-date: 2026-08-28

  # Configure one trade CSV per strategy.
  # The correlation is calculated from daily compounded trade returns.
  trade-files:
    EUNK: data/local/trades/EUNK2020_trades_895902000.csv
    SXRV: data/local/trades/SXRV2020_trades_478116000.csv
    CL2: data/local/trades/CL2_2020_trades_154974000.csv
    EQAC: data/local/trades/EQAC_trades_679978000.csv
    L8I7: data/local/trades/L8I7_trades_403418000.csv
    QQQ3: data/local/trades/QQQ3_2020_trades_364630000.csv
