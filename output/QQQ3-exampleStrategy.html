            line-height: 1.5;
            white-space: nowrap;
            z-index: 10;

        .legend {

            font-size: 12px;

    </style>
</head>

    const canvas = document.getElementById("chart");
    const container = document.getElementById("chartContainer");
    const tooltip = document.getElementById("tooltip");
    const ctx = canvas.getContext("2d");

    const margin = {
        left: 65,
        right: 85,
        top: 25,
        bottom: 45
    };

    let start = 0;
    let visibleCount = Math.min(250, candles.length);

    let dragging = false;
    let dragX = 0;
    let dragStart = 0;

    function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        const dpr = Math.max(1, window.devicePixelRatio || 1);

        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);

        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        draw();
    }

    function visibleCandles() {
        return candles.slice(
            start,
            Math.min(candles.length, start + visibleCount)
        );
    }

    function priceRange(data) {
        let min = Infinity;
        let max = -Infinity;

        for (const candle of data) {
            min = Math.min(min, candle.low);
            max = Math.max(max, candle.high);
        }

        const padding = Math.max((max - min) * 0.05, 1);

        return {
            min: min - padding,
            max: max + padding
        };
    }

    function xFor(index, count, width) {
        const chartWidth =
            width - margin.left - margin.right;

        return margin.left +
                (index + 0.5) * chartWidth / count;
    }

    function yFor(price, range, height) {
        const chartHeight =
            height - margin.top - margin.bottom;

        return margin.top +
                (range.max - price) *
                chartHeight /
                (range.max - range.min);
    }

    function draw() {
        const width = container.clientWidth;
        const height = container.clientHeight;

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, width, height);

        if (candles.length === 0) {
            return;
        }

        const data = visibleCandles();
        const range = priceRange(data);

        drawGrid(width, height, range);
        drawCandles(width, height, data, range);

        /*
         * IMPORTANTE:
         * Los trades se pintan sobre las mismas candles
         * que proceden de MarketData.
         */
        drawTrades(width, height, data, range);

        drawDates(width, height, data);
    }

    function drawGrid(width, height, range) {
        const chartHeight =
            height - margin.top - margin.bottom;

        const rows = 8;

        ctx.strokeStyle = "#e4e7eb";
        ctx.fillStyle = "#68707a";
        ctx.lineWidth = 1;
        ctx.font = "11px Arial";

        for (let i = 0; i <= rows; i++) {
            const yy =
                margin.top +
                i * chartHeight / rows;

            ctx.beginPath();
            ctx.moveTo(margin.left, yy);
            ctx.lineTo(width - margin.right, yy);
            ctx.stroke();

            const price =
                range.max -
                i * (range.max - range.min) / rows;

            ctx.fillText(
                formatPrice(price),
                width - margin.right + 8,
                yy + 4
            );
        }
    }

    function drawCandles(width, height, data, range) {
        const slot =
            (width - margin.left - margin.right)
            / data.length;

        const bodyWidth =
            Math.max(2, Math.min(14, slot * 0.68));

        for (let i = 0; i < data.length; i++) {
            const candle = data[i];

            const xx =
                xFor(i, data.length, width);

            const highY =
                yFor(candle.high, range, height);

            const lowY =
                yFor(candle.low, range, height);

            const openY =
                yFor(candle.open, range, height);

            const closeY =
                yFor(candle.close, range, height);

            const bullish =
                candle.close >= candle.open;

            const color =
                bullish ? "#20a464" : "#dc4c4c";

            /*
             * Mecha: LOW -> HIGH
             */
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.moveTo(xx, highY);
            ctx.lineTo(xx, lowY);
            ctx.stroke();

            /*
             * Cuerpo: OPEN -> CLOSE
             */
            const top = Math.min(openY, closeY);
            const bodyHeight =
                Math.max(1, Math.abs(closeY - openY));

            ctx.fillStyle = color;

            ctx.fillRect(
                xx - bodyWidth / 2,
                top,
                bodyWidth,
                bodyHeight
            );

            ctx.strokeStyle = color;
            ctx.strokeRect(
                xx - bodyWidth / 2,
                top,
                bodyWidth,
                bodyHeight
            );
        }
    }

    function drawTrades(width, height, data, range) {
        for (const trade of trades) {

            /*
             * Buscamos la candle exacta de entrada
             * y la candle exacta de salida.
             */
            const entryIndex =
                data.findIndex(
                    candle =>
                        candle.date === trade.entryDate
                );

            const exitIndex =
                data.findIndex(
                    candle =>
                        candle.date === trade.exitDate
                );

            /*
             * Entrada:
             * se pinta sobre el precio de entrada.
             */
            if (entryIndex >= 0) {
                drawEntryMarker(
                    width,
                    height,
                    data,
                    range,
                    entryIndex,
                    trade
                );
            }

            /*
             * Salida:
             * se pinta sobre el precio de salida.
             */
            if (exitIndex >= 0) {
                drawExitMarker(
                    width,
                    height,
                    data,
                    range,
                    exitIndex,
                    trade
                );
            }

            /*
             * Une visualmente entrada y salida.
             */
            if (entryIndex >= 0 && exitIndex >= 0) {
                drawTradeLine(
                    width,
                    height,
                    data,
                    range,
                    entryIndex,
                    trade.entryPrice,
                    exitIndex,
                    trade.exitPrice
                );
            }
        }
    }

    function drawTradeLine(
        width,
        height,
        data,
        range,
        entryIndex,
        entryPrice,
        exitIndex,
        exitPrice
    ) {
        const x1 =
            xFor(entryIndex, data.length, width);

        const y1 =
            yFor(entryPrice, range, height);

        const x2 =
            xFor(exitIndex, data.length, width);

        const y2 =
            yFor(exitPrice, range, height);

        ctx.save();

        ctx.strokeStyle = "#777";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.restore();
    }

    function drawEntryMarker(
        width,
        height,
        data,
        range,
        index,
        trade
    ) {
        const xx =
            xFor(index, data.length, width);

        const yy =
            yFor(trade.entryPrice, range, height);

        /*
         * Triángulo verde apuntando hacia arriba.
         */
        ctx.save();

        ctx.fillStyle = "#087f3d";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(xx, yy - 11);
        ctx.lineTo(xx - 7, yy + 3);
        ctx.lineTo(xx + 7, yy + 3);
        ctx.closePath();

        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawExitMarker(
        width,
        height,
        data,
        range,
        index,
        trade
    ) {
        const xx =
            xFor(index, data.length, width);

        const yy =
            yFor(trade.exitPrice, range, height);

        /*
         * Triángulo rojo apuntando hacia abajo.
         */
        ctx.save();

        ctx.fillStyle = "#b51f1f";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(xx, yy + 11);
        ctx.lineTo(xx - 7, yy - 3);
        ctx.lineTo(xx + 7, yy - 3);
        ctx.closePath();

        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawDates(width, height, data) {
        const slot =
            (width - margin.left - margin.right)
            / data.length;

        const step =
            Math.max(1, Math.ceil(data.length / 8));

        ctx.fillStyle = "#68707a";
        ctx.font = "11px Arial";

        for (let i = 0; i < data.length; i += step) {
            const xx =
                margin.left + (i + 0.5) * slot;

            ctx.fillText(
                data[i].date,
                xx - 35,
                height - 15
            );
        }
    }

    function formatPrice(value) {
        return (value / 100).toFixed(2);
    }

    function tradeAtPoint(event) {
        const rect =
            canvas.getBoundingClientRect();

        const mouseX =
            event.clientX - rect.left;

        const mouseY =
            event.clientY - rect.top;

        const data = visibleCandles();

        if (!data.length) {
            return null;
        }

        const range = priceRange(data);

        for (const trade of trades) {

            const entryIndex =
                data.findIndex(
                    candle =>
                        candle.date === trade.entryDate
                );

            if (entryIndex >= 0) {
                const xx =
                    xFor(
                        entryIndex,
                        data.length,
                        rect.width
                    );

                const yy =
                    yFor(
                        trade.entryPrice,
                        range,
                        rect.height
                    );

                if (distance(mouseX, mouseY, xx, yy) < 12) {
                    return {
                        type: "BUY",
                        trade
                    };
                }
            }

            const exitIndex =
                data.findIndex(
                    candle =>
                        candle.date === trade.exitDate
                );

            if (exitIndex >= 0) {
                const xx =
                    xFor(
                        exitIndex,
                        data.length,
                        rect.width
                    );

                const yy =
                    yFor(
                        trade.exitPrice,
                        range,
                        rect.height
                    );

                if (distance(mouseX, mouseY, xx, yy) < 12) {
                    return {
                        type: "SELL",
                        trade
                    };
                }
            }
        }

        return null;
    }

    function distance(x1, y1, x2, y2) {
        return Math.sqrt(
            Math.pow(x1 - x2, 2) +
            Math.pow(y1 - y2, 2)
        );
    }

    canvas.addEventListener("mousemove", event => {

        if (dragging) {
            const delta =
                event.clientX - dragX;

            const pixelsPerCandle =
                container.clientWidth /
                Math.max(1, visibleCount);

            const candleDelta =
                Math.round(
                    -delta / pixelsPerCandle
                );

            start = Math.max(
                0,
                Math.min(
                    candles.length - visibleCount,
                    dragStart + candleDelta
                )
            );

            draw();
            return;
        }

        const tradeHit =
            tradeAtPoint(event);

        if (tradeHit) {
            const trade =
                tradeHit.trade;

            if (tradeHit.type === "BUY") {
                tooltip.innerHTML = `
                    <strong>🟢 BUY</strong><br>
                    Date: ${trade.entryDate}<br>
                    Price: ${formatPrice(trade.entryPrice)}<br>
                    Type: ${trade.buyType}<br>
                    Quantity: ${trade.quantity}
                `;
            } else {
                tooltip.innerHTML = `
                    <strong>🔴 SELL</strong><br>
                    Date: ${trade.exitDate}<br>
                    Price: ${formatPrice(trade.exitPrice)}<br>
                    Reason: ${trade.closeReason}<br>
                    PnL: ${trade.pnlPercent.toFixed(2)}%
                `;
            }

            tooltip.style.display = "block";

            const rect =
                container.getBoundingClientRect();

            tooltip.style.left =
                Math.min(
                    event.clientX - rect.left + 12,
                    rect.width - 220
                ) + "px";

            tooltip.style.top =
                Math.max(
                    10,
                    event.clientY - rect.top + 12
                ) + "px";

            return;
        }

        /*
         * Si no estamos encima de un trade,
         * mostramos el OHLC de la candle.
         */
        const rect =
            canvas.getBoundingClientRect();

        const mouseX =
            event.clientX - rect.left;

        const data =
            visibleCandles();

        if (!data.length) {
            return;
        }

        const slot =
            (rect.width -
                margin.left -
                margin.right)
            / data.length;

        const index =
            Math.floor(
                (mouseX - margin.left) / slot
            );

        if (index < 0 || index >= data.length) {
            tooltip.style.display = "none";
            return;
        }

        const candle = data[index];

        tooltip.innerHTML = `
            <strong>${candle.date}</strong><br>
            Open: ${formatPrice(candle.open)}<br>
            High: ${formatPrice(candle.high)}<br>
            Low: ${formatPrice(candle.low)}<br>
            Close: ${formatPrice(candle.close)}
        `;

        tooltip.style.display = "block";

        tooltip.style.left =
            Math.min(
                mouseX + 12,
                rect.width - 180
            ) + "px";

        tooltip.style.top =
            Math.max(
                10,
                event.clientY - rect.top + 12
            ) + "px";
    });

    canvas.addEventListener("mouseleave", () => {
        tooltip.style.display = "none";
    });

    canvas.addEventListener("mousedown", event => {
        dragging = true;
        dragX = event.clientX;
        dragStart = start;
    });

    window.addEventListener("mouseup", () => {
        dragging = false;
    });

    canvas.addEventListener(
        "wheel",
        event => {
            if (!candles.length) {
                return;
            }

            event.preventDefault();

            const oldCount = visibleCount;

            const factor =
                event.deltaY < 0 ? 0.8 : 1.25;

            visibleCount =
                Math.max(
                    20,
                    Math.min(
                        candles.length,
                        Math.round(
                            visibleCount * factor
                        )
                    )
                );

            const center =
                start + oldCount / 2;

            start =
                Math.max(
                    0,
                    Math.min(
                        candles.length - visibleCount,
                        Math.round(
                            center -
                            visibleCount / 2
                        )
                    )
                );

            draw();
        },
        { passive: false }
    );

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
</script>
</body>
</html>
